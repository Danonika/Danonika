name: Update private profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check read-only stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo '::error::Add the read-only STATS_TOKEN repository secret before running this workflow.'
            exit 1
          fi

      - name: Generate light activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&hide=stars,commits,contribs&show=contributions,prs_merged,all_time_contribs&contribs_include_own_repos=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide_rank=true&show_icons=true&custom_title=GitHub%20activity&card_width=480&border_radius=12&disable_animations=true&text_bold=false&number_format=long&line_height=28&bg_color=f6f8fa&title_color=137b80&text_color=182c3b&icon_color=137b80&border_color=d8e4e6
          path: assets/stats/activity-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate dark activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&hide=stars,commits,contribs&show=contributions,prs_merged,all_time_contribs&contribs_include_own_repos=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide_rank=true&show_icons=true&custom_title=GitHub%20activity&card_width=480&border_radius=12&disable_animations=true&text_bold=false&number_format=long&line_height=28&bg_color=141e29&title_color=6ad2cc&text_color=ecf4f8&icon_color=6ad2cc&border_color=2a424a
          path: assets/stats/activity-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&layout=compact&langs_count=8&size_weight=0&count_weight=1&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&custom_title=Languages%20across%20my%20repos&card_width=480&border_radius=12&disable_animations=true&bg_color=f6f8fa&title_color=137b80&text_color=182c3b&border_color=d8e4e6
          path: assets/stats/languages-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&layout=compact&langs_count=8&size_weight=0&count_weight=1&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&custom_title=Languages%20across%20my%20repos&card_width=480&border_radius=12&disable_animations=true&bg_color=141e29&title_color=6ad2cc&text_color=ecf4f8&border_color=2a424a
          path: assets/stats/languages-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Validate cards and update README
        run: python3 .github/scripts/publish_stats.py

      - name: Publish aggregate cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update aggregate profile statistics'
          git push
