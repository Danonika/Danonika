name: Update private profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check read-only stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo '::error::Add the read-only STATS_TOKEN repository secret before running this workflow.'
            exit 1
          fi

      - name: Generate light activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&hide=stars,commits,contribs&show=contributions,prs_merged,all_time_contribs&contribs_include_own_repos=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide_rank=true&show_icons=true&custom_title=GitHub%20activity&card_width=480&border_radius=12&disable_animations=true&text_bold=false&number_format=long&line_height=28&bg_color=f8fbff&title_color=087fa3&text_color=10283e&icon_color=087fa3&border_color=cddfed
          path: assets/stats/activity-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate dark activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: 2.2.1
          fail_on_error: true
          options: username=Danonika&hide=stars,commits,contribs&show=contributions,prs_merged,all_time_contribs&contribs_include_own_repos=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&hide_rank=true&show_icons=true&custom_title=GitHub%20activity&card_width=480&border_radius=12&disable_animations=true&text_bold=false&number_format=long&line_height=28&bg_color=0b1220&title_color=67e8f9&text_color=eef6ff&icon_color=67e8f9&border_color=233950
          path: assets/stats/activity-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Check line-count aggregation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Generate code-change cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_USERNAME: Danonika
        run: python3 .github/scripts/code_changes.py

      - name: Validate cards and update README
        run: python3 .github/scripts/publish_stats.py

      - name: Publish aggregate cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update aggregate profile statistics'
          git push
